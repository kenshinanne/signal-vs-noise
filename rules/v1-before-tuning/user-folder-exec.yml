author: Signal vs. Noise project
date: 2026-10-14
title: Process Started From User-Writable Folder (v1 broad)
details: 'Image: %Image% ¦ CommandLine: %CommandLine% ¦ Parent: %ParentImage% ¦ User: %User%'
description: |
    First version of the rule. It alerts when a program starts from a folder that normal users can write to,
    like Temp or AppData. It is broad on purpose, so I can measure the false positives before tuning.

id: 7ad2d891-796f-437d-a25b-42456176f527
level: medium
status: experimental
logsource:
    product: windows
    category: process_creation
    definition: Sysmon needs to be installed.
detection:
    selection:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
        Image|contains:
            - '\AppData\'
            - '\Temp\'
            - '\Users\Public\'
            - '\ProgramData\'
    condition: selection
falsepositives:
    - Software installers
    - Auto-updaters
tags:
    - attack.execution
ruletype: Hayabusa
